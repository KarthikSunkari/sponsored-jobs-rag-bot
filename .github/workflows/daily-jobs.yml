name: Daily Job Scraping and Matching

on:
  schedule:
    # Run every day at 14:00 UTC.
    - cron: '0 14 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: openai/gpt-oss-20b
  GROQ_MAX_COMPLETION_TOKENS: 1024
  GROQ_REQUEST_DELAY_SECONDS: 2.5
  EMBEDDING_MODEL: all-MiniLM-L6-v2
  MIN_RELEVANCE_SCORE: 60
  MAX_DAILY_MATCHES: 20
  MATCH_THRESHOLD: 0.40
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
  GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
  GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Validate configuration
        run: python utils/validate_config.py scrape

      - name: Poll direct ATS feeds and discover additional jobs
        run: |
          python -u etl/scrape_jobs.py --level all --max-jobs 100 --lookback-days 7

      - name: Upload scraping logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scraping-logs
          path: |
            *.log
          retention-days: 7

  match-jobs:
    runs-on: ubuntu-latest
    needs: scrape-jobs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Validate configuration
        run: python utils/validate_config.py match

      - name: Match jobs against resume
        run: |
          python -u rag/match_jobs.py

      - name: Upload matching logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-logs
          path: |
            *.log
          retention-days: 7

  send-notifications:
    runs-on: ubuntu-latest
    needs: match-jobs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Validate configuration
        run: python utils/validate_config.py notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      - name: Send email notifications
        run: |
          python -u agents/notifier.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      - name: Upload notification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-logs
          path: |
            *.log
          retention-days: 7
