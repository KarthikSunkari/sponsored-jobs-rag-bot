name: Daily Job Scraping and Matching

on:
  schedule:
    # Run at 9 AM EST (2 PM UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: llama-3.1-8b-instant
  EMBEDDING_MODEL: all-MiniLM-L6-v2
  MIN_RELEVANCE_SCORE: 80
  MAX_DAILY_MATCHES: 20

jobs:
  scrape-newgrad-jobs:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Chrome and dependencies
        run: |
          apt-get update
          apt-get install -y wget gnupg unzip curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y google-chrome-stable
          rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Scrape New Grad jobs (past 24 hours)
        run: |
          python -u etl/scrape_jobs.py --level newgrad --max-jobs 25
        env:
          DISPLAY: :99

      - name: Upload scraping logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgrad-scraping-logs
          path: |
            *.log
          retention-days: 7

  scrape-midlevel-jobs:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Chrome and dependencies
        run: |
          apt-get update
          apt-get install -y wget gnupg unzip curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y google-chrome-stable
          rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Scrape Mid-Level jobs (past 24 hours)
        run: |
          python -u etl/scrape_jobs.py --level midlevel --max-jobs 25
        env:
          DISPLAY: :99

      - name: Upload scraping logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midlevel-scraping-logs
          path: |
            *.log
          retention-days: 7

  match-jobs:
    runs-on: ubuntu-latest
    needs: [scrape-newgrad-jobs, scrape-midlevel-jobs]
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Match jobs against resume
        run: |
          python -u rag/match_jobs.py

      - name: Upload matching logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-logs
          path: |
            *.log
          retention-days: 7

  send-notifications:
    runs-on: ubuntu-latest
    needs: match-jobs
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Send email notifications
        run: |
          python -u agents/notifier.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      - name: Upload notification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-logs
          path: |
            *.log
          retention-days: 7
